<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VAULTX - Secure File Vault</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            🔐
        </div>


        <!-- Website Name -->
        <h1>VAULTX</h1>

        <p class="subtitle">
            Decentralised • Encrypted • Private
        </p>


        <!-- Login Card -->
        <div class="login-card">

            <h2>Welcome Back</h2>

            <p class="login-description">
                Sign in to access your secure file vault.
            </p>


            <!-- Login Form -->
            <form action="/login" method="POST">

                <!-- Email -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Forgot Password -->
                <div class="forgot">

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- Login Button -->
                <button type="submit">
                    LOGIN
                </button>

            </form>


            <!-- Register Link -->
            <p class="register">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>

        </div>


        <!-- Security Message -->
        <p class="security-note">
            🛡 Your files are protected with strong encryption
        </p>

    </div>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
